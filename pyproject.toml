[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-os"
version = "0.4.1"
description = "Versioned creative operating system around the existing MyDashPerks skill layer."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "mcp>=2.3,<3",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
creative-os = "creative_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 112
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
  "source_snapshots",
  "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["creative_os"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "core: portable source-review checks that do not need visual binaries",
  "full_assets: supplemental visual binaries from the example archives",
]
